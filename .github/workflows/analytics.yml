# Turn expiring access logs into numbers that don't expire.
#
# Raw CloudFront log lines hold IP addresses and are deleted after 90 days
# (LOG_RETENTION_DAYS in sst.config.ts, and a figure /privacy states to
# parents). The counts derived from them hold nothing of the sort, so this job
# reduces the logs to per-day totals and commits them to the repo, where they
# are versioned, readable on GitHub without an AWS login, and permanent.
#
# That is the actual guarantee of the site's history. Retention length only
# governs how far back a forgotten number can be re-derived; if THIS stops
# running, the record of the first year silently becomes "the last ninety
# days". A failure therefore opens an issue rather than going quietly.
#
# Runs monthly. Nothing here is time-critical — the point is that it happens at
# all, on a schedule nobody has to remember.
name: Analytics rollup

on:
  schedule:
    # 04:00 UTC on the 2nd of each month. Not the 1st: CloudFront delivers logs
    # with a lag of minutes to hours, so a run at midnight on the 1st would
    # miss the tail of the month it is meant to be closing.
    - cron: "0 4 2 * *"
  workflow_dispatch:

# Only one may run at a time — two concurrent runs would race on the commit.
concurrency:
  group: analytics-rollup
  cancel-in-progress: false

permissions:
  id-token: write # OIDC, to read the log bucket
  contents: write # to commit the counts
  issues: write # to complain if this stops working

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same role the deploy uses. It already holds S3 read, so measuring
      # the site needed no new permissions and no new AWS resources at all.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-1

      - name: Resolve the log bucket
        id: bucket
        run: |
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          echo "name=schoolskills-access-logs-${ACCOUNT}" >> "$GITHUB_OUTPUT"

      # Everything still in the bucket, which retention already bounds to 90
      # days. Re-counting a day we have counted before is free and harmless:
      # the rollup overwrites per-day rather than accumulating, so a day whose
      # logs arrived late gets corrected instead of doubled.
      - name: Download the logs
        run: |
          mkdir -p /tmp/cflogs
          aws s3 sync "s3://${{ steps.bucket.outputs.name }}/cf/" /tmp/cflogs \
            --no-progress --only-show-errors
          echo "$(find /tmp/cflogs -name '*.gz' | wc -l) log file(s)"

      - name: Count
        run: node scripts/rollup-analytics.mjs /tmp/cflogs analytics/counts.json

      - name: Commit the numbers
        run: |
          if git diff --quiet -- analytics/counts.json; then
            echo "No change — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/counts.json
          git commit -m "Analytics: roll up access logs through $(date -u +%Y-%m-%d)

          Generated by .github/workflows/analytics.yml. Contains per-day counts
          only — no IP addresses and no identifiers. See docs/analytics.md."
          # Rebase rather than merge: this branch moves under us all the time,
          # and a merge commit from a bot in the middle of develop's history
          # would be noise.
          git pull --rebase --autostash origin develop
          git push origin HEAD:develop

      - name: Say so if this stopped working
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Analytics rollup failed";
            const body = [
              "The monthly rollup did not complete: " +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                `/actions/runs/${context.runId}`,
              "",
              "This matters more than it looks. Raw access logs are deleted",
              "after 90 days, so while this job is broken the site's history is",
              "on a timer — anything older than the retention window when it is",
              "fixed is gone for good.",
              "",
              "First thing to check: whether CloudFront is delivering logs at",
              "all (`aws s3 ls s3://schoolskills-access-logs-<account>/cf/`).",
              "An empty prefix means the bucket ACL setup regressed, not that",
              "nobody visited.",
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "analytics",
            });
            if (open.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              ...context.repo, title, body, labels: ["analytics"],
            });
