# Turn expiring access logs into numbers that don't expire.
#
# Raw CloudFront log lines hold IP addresses and are deleted after 90 days
# (LOG_RETENTION_DAYS in sst.config.ts, and a figure /privacy states to
# parents). The counts derived from them hold nothing of the sort, so this job
# reduces the logs to per-day totals and commits them to the repo, where they
# are versioned, readable on GitHub without an AWS login, and permanent.
#
# That is the actual guarantee of the site's history. Retention length only
# governs how far back a forgotten number can be re-derived; if THIS stops
# running, the record of the first year silently becomes "the last ninety
# days". A failure therefore opens an issue rather than going quietly.
#
# Runs monthly. Nothing here is time-critical — the point is that it happens at
# all, on a schedule nobody has to remember.
name: Analytics rollup

on:
  schedule:
    # 04:00 UTC on the 2nd of each month. Not the 1st: CloudFront delivers logs
    # with a lag of minutes to hours, so a run at midnight on the 1st would
    # miss the tail of the month it is meant to be closing.
    - cron: "0 4 2 * *"
  workflow_dispatch:

# Only one may run at a time — two concurrent runs would race on the commit.
concurrency:
  group: analytics-rollup
  cancel-in-progress: false

permissions:
  id-token: write # OIDC, to read the log bucket
  contents: write # to push the branch the counts ride in on
  pull-requests: write # to open that branch's PR and set it to auto-merge
  issues: write # to complain if this stops working

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same role the deploy uses. It already holds S3 read, so measuring
      # the site needed no new permissions and no new AWS resources at all.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-1

      - name: Resolve the log bucket
        id: bucket
        run: |
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          echo "name=schoolskills-access-logs-${ACCOUNT}" >> "$GITHUB_OUTPUT"

      # Everything still in the bucket, which retention already bounds to 90
      # days. Re-counting a day we have counted before is free and harmless:
      # the rollup overwrites per-day rather than accumulating, so a day whose
      # logs arrived late gets corrected instead of doubled.
      - name: Download the logs
        run: |
          mkdir -p /tmp/cflogs
          aws s3 sync "s3://${{ steps.bucket.outputs.name }}/cf/" /tmp/cflogs \
            --no-progress --only-show-errors
          echo "$(find /tmp/cflogs -name '*.gz' | wc -l) log file(s)"

      - name: Count
        run: node scripts/rollup-analytics.mjs /tmp/cflogs analytics/counts.json

      # Through a PR, not a push to develop.
      #
      # `develop` requires the CI status check, and a direct push from Actions
      # carries no check run, so the protected-branch hook declines it
      # outright:
      #
      #   remote: error: GH006: Protected branch update failed
      #   remote: - Required status check "CI" is expected.
      #
      # That was true from the day this job was written. It went unnoticed for
      # a month because the push is the LAST step and the bucket was empty —
      # every run exited at "nothing to commit" before reaching it. The first
      # run with real data was the first run to fail.
      #
      # Auto-merge is what keeps it hands-off: the PR merges itself the moment
      # CI is green, so the gate is honoured without a human in the loop each
      # month. If CI ever fails the PR simply stays open, which is a visible
      # failure rather than a silent one.
      - name: Open a PR with the numbers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- analytics/counts.json; then
            echo "No change — nothing to commit."
            exit 0
          fi

          BRANCH="analytics/rollup-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add analytics/counts.json
          git commit -m "Analytics: roll up access logs through $(date -u +%Y-%m-%d)

          Generated by .github/workflows/analytics.yml. Contains per-day counts
          only — no IP addresses and no identifiers. See docs/analytics.md."

          # Force, because a re-run on the same day reuses the branch name and
          # should replace its commit rather than fail. With-lease so it can
          # still only clobber what it last saw.
          git push --force-with-lease origin "$BRANCH"

          # A PR may already exist from an earlier run today; the force-push
          # above has already updated it, so that alone is not an error.
          #
          # Only THAT is tolerated. A blanket `|| true` here masked the setting
          # that actually blocked this ("GitHub Actions is not permitted to
          # create or approve pull requests") behind a reassuring message, and
          # the step then failed one line later with something unrelated. An
          # error handler that swallows unknown errors is how a broken job
          # reports the wrong cause.
          if ! ERROR="$(gh pr create --base develop --head "$BRANCH" \
            --title "Analytics: counts through $(date -u +%Y-%m-%d)" \
            --body "Per-day totals from CloudFront access logs — no IP addresses and no identifiers. Generated by .github/workflows/analytics.yml; see docs/analytics.md. Merges itself once CI is green." 2>&1)"; then
            case "$ERROR" in
              *"already exists"*)
                echo "PR already open for $BRANCH — the force-push updated it."
                ;;
              *)
                echo "$ERROR" >&2
                exit 1
                ;;
            esac
          fi

          # Give the PR a check to satisfy. Nothing starts CI on its own here:
          # events raised with GITHUB_TOKEN don't trigger workflows, so this PR
          # would otherwise sit blocked forever waiting for a required "CI"
          # context that never appears. Dispatching it runs the real suite
          # against this branch's head commit.
          gh workflow run ci.yml --ref "$BRANCH"

          gh pr merge "$BRANCH" --auto --squash --delete-branch

      - name: Say so if this stopped working
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Analytics rollup failed";
            const body = [
              "The monthly rollup did not complete: " +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                `/actions/runs/${context.runId}`,
              "",
              "This matters more than it looks. Raw access logs are deleted",
              "after 90 days, so while this job is broken the site's history is",
              "on a timer — anything older than the retention window when it is",
              "fixed is gone for good.",
              "",
              "First thing to check: whether CloudFront is delivering logs at",
              "all (`aws s3 ls s3://schoolskills-access-logs-<account>/cf/`).",
              "An empty prefix means the bucket ACL setup regressed, not that",
              "nobody visited.",
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "analytics",
            });
            if (open.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              ...context.repo, title, body, labels: ["analytics"],
            });
